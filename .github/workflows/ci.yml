name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 流量测试需要 tshark；没有会自动 skip，不会红
      - name: Install tshark
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark

      - name: Install deps
        # 用 requirements-ci.txt：不拉 sentence-transformers/torch（测试不需要，CI 上省几分钟）
        run: |
          python -m pip install -U pip
          pip install -r requirements-ci.txt

      - name: Lint
        run: ruff check app scripts tests --select F,E9

      - name: Tests
        run: python -m pytest -q
