[project]
name = "devrag"
version = "1.4.0"
description = "DevRAG：文档 RAG + 网络流量取证的多 Agent 系统（LangGraph + FastAPI）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "scapy>=2.5"]
fetch = ["beautifulsoup4>=4.12", "html2text>=2024.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["F", "E9", "I"]
