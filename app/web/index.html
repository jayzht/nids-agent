<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DevRAG · 文档智能问答 Agent</title>
<style>
  :root{
    --bg:#0b0e14; --bg2:#11151d; --bg3:#161b25; --line:#242b38;
    --fg:#d7dce5; --fg2:#8b95a7; --accent:#4d9ef7; --accent2:#2b6fd4;
    --green:#3fb950; --amber:#d29922; --red:#f85149; --purple:#a371f7;
    --radius:10px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.65;display:flex;flex-direction:column;
  }
  /* ---------- 顶栏 ---------- */
  header{
    display:flex;align-items:center;gap:14px;padding:10px 18px;
    border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap;
  }
  .logo{font-weight:700;font-size:15px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
  .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
  .kb-picker{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .kb-chip{
    padding:4px 11px;border:1px solid var(--line);border-radius:999px;cursor:pointer;
    font-size:12px;color:var(--fg2);background:var(--bg3);user-select:none;transition:.15s;
  }
  .kb-chip:hover{border-color:#3a4557;color:var(--fg)}
  .kb-chip.on{background:rgba(77,158,247,.14);border-color:var(--accent);color:#9ccbfb}
  .spacer{flex:1}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg3)}
  .seg button{background:none;border:0;color:var(--fg2);padding:5px 12px;cursor:pointer;font-size:12px}
  .seg button.on{background:rgba(77,158,247,.16);color:#9ccbfb}
  .btn{
    background:var(--bg3);border:1px solid var(--line);color:var(--fg);padding:5px 12px;
    border-radius:8px;cursor:pointer;font-size:12px;transition:.15s;
  }
  .btn:hover{border-color:#3a4557;background:#1b2130}
  .btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .btn.primary:hover{background:var(--accent)}
  /* ---------- 布局 ---------- */
  main{flex:1;display:grid;grid-template-columns:1fr 380px;min-height:0}
  @media(max-width:1080px){main{grid-template-columns:1fr} aside{display:none}}
  #chat{display:flex;flex-direction:column;min-height:0}
  #messages{flex:1;overflow-y:auto;padding:22px 26px;scroll-behavior:smooth}
  /* ---------- 消息 ---------- */
  .msg{margin-bottom:22px;max-width:860px}
  .msg .role{font-size:11px;color:var(--fg2);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
  .msg.user{display:flex;flex-direction:column;align-items:flex-end;margin-left:auto}
  .msg.user .bubble{
    background:linear-gradient(180deg,#1d3a5f,#172c47);border:1px solid #2a4a75;
    padding:10px 14px;border-radius:var(--radius);white-space:pre-wrap;
  }
  .msg.assistant .bubble{
    background:var(--bg2);border:1px solid var(--line);padding:14px 16px;border-radius:var(--radius);
  }
  .msg.assistant .bubble.err{border-color:rgba(248,81,73,.5)}
  .answer p{margin:.55em 0}
  .answer ul{margin:.5em 0;padding-left:1.3em}
  .answer h3,.answer h4{margin:.9em 0 .4em;font-size:14px;color:#e8edf5}
  .answer code.inline{background:#1e2532;border:1px solid #2a3342;padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:12.5px;color:#e6c07b}
  .answer pre{
    background:#0a0d13;border:1px solid var(--line);border-radius:8px;padding:12px;
    overflow-x:auto;margin:.7em 0;position:relative;
  }
  .answer pre code{font-family:var(--mono);font-size:12.5px;line-height:1.55;color:#c9d1d9}
  .cite{
    display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;
    padding:0 5px;margin:0 2px;border-radius:5px;background:rgba(77,158,247,.18);
    color:#7cb8f8;font-size:11px;font-family:var(--mono);cursor:pointer;vertical-align:1px;
    border:1px solid rgba(77,158,247,.3);
  }
  .cite:hover{background:rgba(77,158,247,.35);color:#fff}
  /* ---------- 步骤 ---------- */
  details.trace{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  details.trace summary{
    cursor:pointer;font-size:11.5px;color:var(--fg2);list-style:none;display:flex;gap:8px;align-items:center;
  }
  details.trace summary::-webkit-details-marker{display:none}
  details.trace summary:hover{color:var(--fg)}
  .step{
    display:grid;grid-template-columns:74px 1fr;gap:8px;padding:5px 0;font-size:12px;
    border-bottom:1px solid rgba(36,43,56,.55);
  }
  .step .node{font-family:var(--mono);font-size:11px;color:var(--purple)}
  .step .title{color:#b9c2d0}
  .step .detail{grid-column:2;color:var(--fg2);font-family:var(--mono);font-size:11px;
    white-space:pre-wrap;word-break:break-all;max-height:120px;overflow:auto}
  /* ---------- 输入区 ---------- */
  footer{border-top:1px solid var(--line);background:var(--bg2);padding:12px 20px}
  .composer{display:flex;gap:10px;align-items:flex-end;max-width:1000px;margin:0 auto}
  textarea{
    flex:1;resize:none;background:var(--bg3);border:1px solid var(--line);border-radius:10px;
    color:var(--fg);padding:11px 14px;font-family:inherit;font-size:14px;outline:none;
    max-height:180px;min-height:46px;line-height:1.5;
  }
  textarea:focus{border-color:var(--accent)}
  .send{height:46px;padding:0 22px;border-radius:10px;font-size:13px}
  .hint{text-align:center;color:var(--fg2);font-size:11px;margin-top:8px}
  .samples{display:flex;gap:8px;flex-wrap:wrap;max-width:1000px;margin:0 auto 10px}
  .sample{font-size:12px;padding:4px 10px;border:1px dashed var(--line);border-radius:999px;
    color:var(--fg2);cursor:pointer;background:none}
  .sample:hover{border-color:var(--accent);color:#9ccbfb}
  /* ---------- 右侧面板 ---------- */
  aside{
    border-left:1px solid var(--line);background:var(--bg2);overflow-y:auto;padding:16px;
    display:flex;flex-direction:column;gap:14px;
  }
  .panel h4{margin:0 0 8px;font-size:12px;color:var(--fg2);text-transform:uppercase;letter-spacing:.6px}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;font-size:12px}
  .kv .k{color:var(--fg2)}
  .kv .v{font-family:var(--mono);font-size:11.5px;word-break:break-all}
  .src{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
  .src .t{font-size:12px;color:#cfe0f5;font-weight:500}
  .src .p{font-family:var(--mono);font-size:10.5px;color:var(--fg2);margin:3px 0 6px;word-break:break-all}
  .src .s{font-size:11.5px;color:#a7b1c2;max-height:120px;overflow:auto;white-space:pre-wrap}
  .src a{color:var(--accent);font-size:11px;text-decoration:none}
  /* ---------- 弹窗 ---------- */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;
    justify-content:center;z-index:50;backdrop-filter:blur(3px)}
  .modal.on{display:flex}
  .modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;
    width:min(760px,92vw);max-height:82vh;overflow-y:auto;padding:20px}
  .modal h3{margin:0 0 12px;font-size:15px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--fg2);font-weight:500;font-size:11px;text-transform:uppercase}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.2);
    border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .badge{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--fg2)}
  .badge.ok{color:var(--green);border-color:rgba(63,185,80,.35);background:rgba(63,185,80,.1)}
  .badge.warn{color:var(--amber);border-color:rgba(210,153,34,.35);background:rgba(210,153,34,.1)}
  .fb{display:flex;gap:6px;margin-top:8px}
  .fb button{background:none;border:1px solid var(--line);color:var(--fg2);border-radius:6px;
    padding:2px 8px;cursor:pointer;font-size:11px}
  .fb button:hover{color:var(--fg)}
  .fb button.on{color:var(--green);border-color:rgba(63,185,80,.5)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#2a3342;border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="dot"></span>DevRAG</div>
  <div class="kb-picker" id="kbPicker"></div>
  <div class="spacer"></div>
  <div class="seg" id="modeSeg">
    <button data-mode="graph" class="on" title="固定编排：改写→检索→打分→生成→校验">CRAG 流程</button>
    <button data-mode="react" title="模型自主调用工具">ReAct Agent</button>
  </div>
  <button class="btn" id="btnTraffic">流量取证</button>
  <button class="btn" id="btnEval">评测</button>
  <button class="btn" id="btnKb">知识库</button>
</header>

<main>
  <section id="chat">
    <div id="messages"></div>
    <footer>
      <div class="samples" id="samples"></div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="btn primary send" id="send">发送</button>
      </div>
      <div class="hint">回答基于本地文档检索生成，点击引用可查看原文</div>
    </footer>
  </section>

  <aside>
    <div class="panel">
      <h4>系统信息</h4>
      <div class="kv" id="sysInfo"><div class="k">状态</div><div class="v">加载中…</div></div>
    </div>
    <div class="panel">
      <h4>本轮引用来源</h4>
      <div id="sources"><div class="src"><div class="s">检索结果会显示在这里</div></div></div>
    </div>
  </aside>
</main>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
const $ = (s) => document.querySelector(s);
const state = { kbs: [], selected: new Set(), mode: "graph", sessionId: null, streaming: false };

/* ---------------- 极简 Markdown 渲染 ---------------- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function renderMd(md){
  const blocks = md.split(/```/);
  let out = "";
  blocks.forEach((seg, i) => {
    if (i % 2 === 1) {                       // 代码块
      const firstNl = seg.indexOf("\n");
      const code = firstNl >= 0 ? seg.slice(firstNl + 1) : seg;
      out += `<pre><code>${esc(code.replace(/\s+$/,""))}</code></pre>`;
    } else {
      out += renderText(seg);
    }
  });
  return out;
}
function renderText(text){
  const lines = esc(text).split("\n");
  let html = "", inList = false;
  const inline = (s) => s
      .replace(/`([^`]+)`/g, '<code class="inline">$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\[(\d+)\]/g, (m, n) => `<span class="cite" data-idx="${n}">${n}</span>`)
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  for (const raw of lines) {
    const l = raw.trimEnd();
    if (/^\s*[-*]\s+/.test(l)) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${inline(l.replace(/^\s*[-*]\s+/, ""))}</li>`;
      continue;
    }
    if (inList) { html += "</ul>"; inList = false; }
    if (!l.trim()) { html += ""; continue; }
    if (/^#{1,6}\s/.test(l)) {
      const level = Math.min(l.match(/^#+/)[0].length + 2, 6);
      html += `<h${level}>${inline(l.replace(/^#+\s+/, ""))}</h${level}>`;
    } else {
      html += `<p>${inline(l)}</p>`;
    }
  }
  if (inList) html += "</ul>";
  return html;
}

/* ---------------- 消息渲染 ---------------- */
function addUser(text){
  const el = document.createElement("div");
  el.className = "msg user";
  el.innerHTML = `<div class="role">你</div><div class="bubble"></div>`;
  el.querySelector(".bubble").textContent = text;
  $("#messages").appendChild(el); scrollBottom();
}
function addAssistant(){
  const el = document.createElement("div");
  el.className = "msg assistant";
  el.innerHTML = `<div class="role">DevRAG</div>
    <div class="bubble"><div class="answer"><span class="spin"></span></div></div>
    <details class="trace"><summary>执行过程</summary><div class="steps"></div></details>
    <div class="fb"><button data-fb="up">👍 有用</button><button data-fb="down">👎 没用</button></div>`;
  $("#messages").appendChild(el); scrollBottom();
  return el;
}
function scrollBottom(){ const m = $("#messages"); m.scrollTop = m.scrollHeight; }

function stepLine(step){
  const d = step.detail || {};
  let brief = "";
  if (step.node === "rewrite") brief = (d.queries || []).join(" | ");
  else if (step.node === "retrieve") brief = `${(d.candidates || []).length} 候选 · ${d.ms ?? ""}ms`;
  else if (step.node === "grade") brief = `${(d.grades || []).filter(g => (g.score ?? 0) >= 1).length}/${(d.grades || []).length} 相关`;
  else if (step.node === "router") brief = `kbs=${(d.kbs || []).join(",") || "-"}`;
  else if (step.node === "generate" || step.node === "chat") brief = `${d.context_chars ?? ""} 字符上下文`;
  else if (step.node === "verify") brief = d.packets ? `包号 ${(d.packets || []).slice(0,6).join(",")}` : `引用 ${(d.valid || []).join(",") || "无"}`;
  else if (step.node === "load") brief = `${d.protocols ? Object.keys(d.protocols).join("/") : ""} · ${d.ms ?? ""}ms`;
  else if (step.node === "triage") brief = `${(d || []).filter(p => p.pursue !== false).length} 条待查`;
  else if (step.node === "collect") brief = `${(d.kinds || []).join(",")} · ${d.ms ?? ""}ms`;
  else if (step.node === "ground") brief = `${(d.docs || []).join(" | ")}`;
  else if (step.node === "report") brief = `${d.ms ?? ""}ms`;
  const agent = step.agent ? `<span style="color:#8b95a7">[${esc(step.agent)}]</span> ` : "";
  return `<div class="step"><div class="node">${agent}${esc(step.node || "")}</div>
    <div class="title">${esc(step.title || "")}</div>
    <div class="detail">${esc(brief)}</div></div>`;
}

/* ---------------- 发送 ---------------- */
async function send(){
  const input = $("#input");
  const q = input.value.trim();
  if (!q || state.streaming) return;
  input.value = ""; input.style.height = "auto";
  await ask(q);
}

async function ask(q){
  addUser(q);
  const node = addAssistant();
  const answerEl = node.querySelector(".answer");
  const stepsEl = node.querySelector(".steps");
  state.streaming = true;

  const body = {
    question: q,
    kbs: state.selected.size ? [...state.selected] : null,
    session_id: state.sessionId,
    mode: state.mode,
    stream: true,
  };

  let answer = "", steps = [], final = null, buf = "";
  try {
    const resp = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${await resp.text()}`);
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith("data:")) continue;
        let ev;
        try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
        if (ev.type === "start") { state.sessionId = ev.session_id; }
        else if (ev.type === "step") { steps.push(ev); stepsEl.innerHTML = steps.map(stepLine).join(""); }
        else if (ev.type === "token") {
          answer += ev.text;
          answerEl.innerHTML = renderMd(answer);
          scrollBottom();
        } else if (ev.type === "final") {
          final = ev;
          answer = ev.answer || answer;
          answerEl.innerHTML = renderMd(answer);
          renderSources(ev.citations || [], ev.kbs || []);
          scrollBottom();
        } else if (ev.type === "error") {
          answerEl.innerHTML = `<p style="color:var(--red)">出错了：${esc(ev.message)}</p>`;
        }
      }
    }
  } catch (e) {
    answerEl.innerHTML = `<p style="color:var(--red)">请求失败：${esc(String(e.message || e))}</p>`;
  } finally {
    state.streaming = false;
    if (!answer) answerEl.innerHTML = "<p>（无输出）</p>";
    if (final && final.steps && final.steps.length > steps.length) {
      stepsEl.innerHTML = final.steps.map(stepLine).join("");
    }
    bindCite(node, final);
    node._meta = { question: q, answer, messageId: final?.message_id };
    bindFeedback(node);
  }
}

function bindCite(node, final){
  const cites = final?.citations || [];
  node.querySelectorAll(".cite").forEach(el => {
    el.onclick = () => {
      const idx = Number(el.dataset.idx);
      const c = cites.find(x => x.index === idx);
      if (c) openSource(c);
    };
  });
}

function renderSources(citations, kbs){
  const box = $("#sources");
  if (!citations.length) { box.innerHTML = `<div class="src"><div class="s">本轮没有引用来源</div></div>`; return; }
  box.innerHTML = citations.map(c => `
    <div class="src" data-chunk="${esc(c.chunk_id)}" data-kb="${esc(c.kb)}" style="cursor:pointer">
      <div class="t">[${c.index}] ${esc(c.title)}</div>
      <div class="p">${esc(c.kb)} / ${esc(c.path)}</div>
      <div class="s">${esc((c.snippet || "").slice(0, 160))}…</div>
    </div>`).join("");
  box.querySelectorAll(".src").forEach(el => {
    el.onclick = () => openChunk(el.dataset.kb, el.dataset.chunk);
  });
}

function bindFeedback(node){
  node.querySelectorAll("[data-fb]").forEach(btn => {
    btn.onclick = async () => {
      node.querySelectorAll("[data-fb]").forEach(b => b.classList.remove("on"));
      btn.classList.add("on");
      await fetch("/api/feedback", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session_id: state.sessionId || "", message_id: node._meta?.messageId || "",
          rating: btn.dataset.fb, question: node._meta?.question || "",
          answer: (node._meta?.answer || "").slice(0, 4000),
        }),
      }).catch(() => {});
    };
  });
}

/* ---------------- 引用详情 ---------------- */
async function openChunk(kb, chunkId){
  const r = await fetch(`/api/chunks/${kb}/${chunkId}`);
  if (!r.ok) return;
  const c = await r.json();
  openModal(`<h3>${esc(c.heading_path || c.title)}</h3>
    <div style="font-family:var(--mono);font-size:11px;color:var(--fg2);margin-bottom:10px">
      ${esc(c.kb)} / ${esc(c.path)} ${c.source_url ? `· <a href="${esc(c.source_url)}" target="_blank" rel="noopener" style="color:var(--accent)">原文</a>` : ""}
    </div>
    <pre style="background:#0a0d13;border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;font-family:var(--mono);font-size:12px;max-height:58vh;overflow:auto">${esc(c.text)}</pre>`);
}

function openSource(c){
  openModal(`<h3>[${c.index}] ${esc(c.title)}</h3>
    <div style="font-family:var(--mono);font-size:11px;color:var(--fg2);margin-bottom:10px">
      ${esc(c.kb)} / ${esc(c.path)} ${c.source_url ? `· <a href="${esc(c.source_url)}" target="_blank" rel="noopener" style="color:var(--accent)">原文</a>` : ""}
    </div>
    <div style="white-space:pre-wrap;font-size:12.5px;color:#b9c2d0">${esc(c.snippet || "")}</div>
    <div style="margin-top:14px"><button class="btn" onclick="document.getElementById('modal').classList.remove('on')">关闭</button></div>`);
}

function openModal(html){ $("#modalBox").innerHTML = html; $("#modal").classList.add("on"); }
$("#modal").onclick = (e) => { if (e.target.id === "modal") e.currentTarget.classList.remove("on"); };

/* ---------------- 初始化 ---------------- */
async function loadInfo(){
  const r = await fetch("/api/info");
  const d = await r.json();
  const kbs = d.kbs || [];
  $("#kbPicker").innerHTML = kbs.length
    ? kbs.map(k => `<div class="kb-chip" data-kb="${esc(k.name)}">${esc(k.title)} <span style="opacity:.55">${k.num_chunks}</span></div>`).join("")
    : `<div class="kb-chip" style="border-style:dashed">暂无知识库</div>`;
  $("#kbPicker").querySelectorAll("[data-kb]").forEach(el => {
    el.onclick = () => {
      const name = el.dataset.kb;
      if (state.selected.has(name)) { state.selected.delete(name); el.classList.remove("on"); }
      else { state.selected.add(name); el.classList.add("on"); }
    };
  });
  $("#sysInfo").innerHTML = `
    <div class="k">LLM</div><div class="v">${esc(d.llm.model)}</div>
    <div class="k">Embedding</div><div class="v">${esc(d.embedding.model)}</div>
    <div class="k">向量存储</div><div class="v">${esc(d.retrieval.vector_backend)}</div>
    <div class="k">混合检索</div><div class="v">BM25 ${d.retrieval.bm25_weight} / 向量 ${(1 - d.retrieval.bm25_weight).toFixed(1)}</div>
    <div class="k">召回调参</div><div class="v">top_k=${d.retrieval.top_k} · cand=${d.retrieval.candidate_k}</div>
    <div class="k">分块</div><div class="v">${d.chunking.chunk_tokens} tok / overlap ${d.chunking.overlap}</div>
    <div class="k">知识库</div><div class="v">${kbs.length} 个 · ${kbs.reduce((a, b) => a + b.num_chunks, 0)} 片段</div>`;
}

async function loadSamples(){
  try {
    const r = await fetch("/api/eval/dataset?kb=fastapi");
    const d = await r.json();
    const items = (d.items || []).slice(0, 4);
    $("#samples").innerHTML = items.map(i => `<button class="sample">${esc(i.question)}</button>`).join("");
    $("#samples").querySelectorAll(".sample").forEach((b, i) => b.onclick = () => ask(items[i].question));
  } catch { /* 忽略 */ }
}

/* 知识库面板 */
$("#btnKb").onclick = async () => {
  const r = await fetch("/api/kbs");
  const kbs = await r.json();
  const rows = kbs.map(k => `<tr>
      <td>${esc(k.name)}</td><td>${esc(k.title)}</td>
      <td>${k.num_docs}</td><td>${k.num_chunks}</td>
      <td><span class="badge ok">${k.loaded ? "已加载" : "磁盘"}</span></td>
      <td style="white-space:nowrap">
        <button class="btn" onclick="reindex('${k.name}')">重建</button>
        <button class="btn" onclick="delKb('${k.name}')">删除</button>
      </td></tr>`).join("");
  openModal(`<h3>知识库</h3>
    <table><thead><tr><th>名称</th><th>标题</th><th>文档</th><th>片段</th><th>状态</th><th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="6" style="color:var(--fg2)">还没有知识库，先运行 scripts/fetch_corpus.py</td></tr>'}</tbody></table>
    <div style="margin-top:14px;color:var(--fg2);font-size:11.5px">
      新增语料：把 Markdown 放到 data/raw/&lt;name&gt;/ 后执行 POST /api/kbs，或直接跑 scripts/build_index.py
    </div>`);
};

async function reindex(name){
  await fetch(`/api/kbs/${name}/reindex`, { method: "POST" });
  const t = setInterval(async () => {
    const r = await fetch(`/api/kbs/${name}/status`);
    const s = await r.json();
    openModal(`<h3>重建 ${esc(name)}</h3><div style="font-size:12.5px">${esc(s.phase || "")} ·
      ${s.current}/${s.total} <span class="spin"></span></div>`);
    if (s.status === "done" || s.status === "error") {
      clearInterval(t);
      openModal(`<h3>重建${s.status === "done" ? "完成" : "失败"}</h3>
        <div style="font-size:12.5px">${esc(s.message || "")}</div>
        <div style="margin-top:14px"><button class="btn" onclick="location.reload()">刷新页面</button></div>`);
    }
  }, 1200);
}
async function delKb(name){
  if (!confirm(`确定删除知识库 ${name}？`)) return;
  await fetch(`/api/kbs/${name}`, { method: "DELETE" });
  location.reload();
}

/* 评测面板 */
$("#btnEval").onclick = () => {
  openModal(`<h3>检索评测</h3>
    <div style="font-size:12px;color:var(--fg2);margin-bottom:10px">
      用内置 golden set 计算 recall@k / MRR / nDCG，纯本地不调 LLM。
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn primary" onclick="runEval('retrieval')">跑检索评测</button>
      <button class="btn" onclick="runEval('end2end')">端到端评测（慢）</button>
    </div>
    <div id="evalOut" style="font-size:12.5px"></div>`);
};
async function runEval(mode){
  $("#evalOut").innerHTML = `<span class="spin"></span> 运行中…（${mode === "end2end" ? "每题都会跑一遍 Agent，约 1-2 分钟" : "秒级"}）`;
  const r = await fetch("/api/eval/run", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mode, top_k: 6 }),
  });
  const d = await r.json();
  if (d.error) { $("#evalOut").textContent = d.error; return; }
  const rows = Object.entries(d.summary).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
  const detail = (d.details || []).slice(0, 12).map(x => `<tr>
      <td style="max-width:260px">${esc(x.question)}</td>
      <td>${x["recall@6"]?.toFixed?.(2) ?? x["recall@6"]}</td>
      <td style="font-family:var(--mono);font-size:10.5px;color:var(--fg2)">${esc((x.retrieved || [])[0] || "-")}</td>
    </tr>`).join("");
  $("#evalOut").innerHTML = `
    <div class="badge ok">${d.num_questions} 题 · ${d.elapsed}s</div>
    <table style="margin:10px 0"><tbody>${rows}</tbody></table>
    <h3 style="margin-top:14px">明细</h3>
    <table><thead><tr><th>问题</th><th>recall</th><th>Top1 文档</th></tr></thead><tbody>${detail}</tbody></table>`;
}

$("#btnTraffic").onclick = async () => {
  try {
    const r = await fetch("/api/traffic/pcaps");
    const items = await r.json();
    const rows = items.map(i => `<tr>
      <td style="font-family:var(--mono);font-size:11.5px">${esc(i.rel)}</td>
      <td>${(i.size / 1024).toFixed(1)} KB</td>
      <td><button class="btn" data-pcap="${esc(i.rel)}" data-mode="single">单 Agent</button>
          <button class="btn" data-pcap="${esc(i.rel)}" data-mode="multi">多 Agent 融合</button></td></tr>`).join("");
    openModal(`<h3>流量取证</h3>
      <div style="font-size:12px;color:var(--fg2);margin-bottom:12px">
        分析是「规则引擎出事实 → Agent 写报告」：每条结论都会带证据包号和文档引用。
        样本在 <code>data/pcaps/samples/</code>，也可以把自己的 pcap 丢进 <code>data/pcaps/</code>。
      </div>
      <table><thead><tr><th>文件</th><th>大小</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="3" style="color:var(--fg2)">data/pcaps 下没有 pcap 文件</td></tr>'}</tbody></table>`);
    document.querySelectorAll("[data-pcap]").forEach(b => b.onclick = () => runTraffic(b.dataset.pcap, b.dataset.mode));
  } catch (e) {
    openModal(`<h3>流量取证</h3><div style="color:var(--red)">${esc(String(e))}</div>`);
  }
};

async function runTraffic(rel, mode = "single") {
  openModal(`<h3>${esc(rel)}</h3>
    <div id="tMode" class="badge" style="margin-bottom:8px">${mode === "multi" ? "多 Agent：行为 + 签名（Suricata）" : "单 Agent：行为检测"}</div>
    <div id="tSteps" style="margin-bottom:10px"></div>
    <div class="answer" id="tReport"
         style="background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:14px">
      <span class="spin"></span> 分析中（规则引擎 + Agent，约 30 秒）…
    </div>`);
  let report = "", steps = [], buf = "";
  try {
    const resp = await fetch("/api/traffic/analyze", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pcap: rel, mode }),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith("data:")) continue;
        let ev;
        try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
        if (ev.type === "step") {
          steps.push(ev);
          $("#tSteps").innerHTML = steps.map(stepLine).join("");
        } else if (ev.type === "token") {
          report += ev.text;
          $("#tReport").innerHTML = renderMd(report);
        } else if (ev.type === "final") {
          report = ev.answer || report;
          let html = renderMd(report);
          if (ev.citations && ev.citations.length) {
            html += `<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">
              <div style="font-size:11px;color:var(--fg2);margin-bottom:6px">引用的知识库文档</div>` +
              ev.citations.map(c => `<div style="font-family:var(--mono);font-size:11px;color:#9ccbfb">
                [K${c.index}] ${esc(c.path)} · ${esc(c.title || "")}</div>`).join("") + `</div>`;
          }
          $("#tReport").innerHTML = html;
        } else if (ev.type === "error") {
          $("#tReport").innerHTML = `<p style="color:var(--red)">出错：${esc(ev.message)}</p>`;
        }
      }
    }
  } catch (e) {
    $("#tReport").innerHTML = `<p style="color:var(--red)">请求失败：${esc(String(e.message || e))}</p>`;
  }
  if (!report) $("#tReport").innerHTML = "<p>（无输出）</p>";
}

/* 交互 */

  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 180) + "px";
});
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("#send").onclick = send;
$("#modeSeg").onclick = (e) => {
  const btn = e.target.closest("button[data-mode]");
  if (!btn) return;
  $("#modeSeg").querySelectorAll("button").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  state.mode = btn.dataset.mode;
};

loadSamples();
